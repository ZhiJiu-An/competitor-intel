<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Acme Pricing</title></head>
<body>
<main>
  <h1>定价</h1>
  <div class="pricing-table">
    <div class="tier">
      <h2>Free</h2>
      <span class="price">¥0</span>
      <ul><li>5GB 存储</li><li>1 个席位</li></ul>
    </div>
    <div class="tier">
      <h2>Pro</h2>
      <span class="price">¥99/月</span>
      <ul><li>100GB 存储</li><li>10 个席位</li><li>AI 助手</li></ul>
    </div>
  </div>
  <p class="audience">适合中小型团队与个人开发者。</p>
</main>
</body>
</html>
