[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-intel"
version = "0.1.1"
description = "竞品情报系统：Schema 契约驱动的竞品采集、结构化抽取与增量 diff 报告管道"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "crawl4ai>=0.4,<0.5",
  "litellm>=1.50,<2",
  "playwright>=1.44,<2",
  "langgraph>=0.2,<0.3",
  "langgraph-checkpoint-sqlite>=2,<3",
  "langchain-core>=0.3,<0.4",
  "pydantic>=2.7,<3",
  "aiosqlite>=0.20,<0.21",
  "typer>=0.15,<0.20",
  "tenacity>=8.2,<9",
  "structlog>=24.1,<25",
  "selectolax>=0.3,<0.4",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
]

[project.urls]
Repository = "https://github.com/ZhiJiu-An/competitor-intel"
Issues = "https://github.com/ZhiJiu-An/competitor-intel/issues"

[project.optional-dependencies]
# 只装内核（抓取 + 抽取 + 报告）时不需要任何 extra
mcp = ["mcp>=2.3,<3"]
http = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1", "markdown>=3.6,<4"]
schedule = ["celery>=5.4,<6", "redis>=5,<7"]
all = ["competitor-intel[mcp,http,schedule]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27,<1", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
ci = "competitor_intel.cli:app"
competitor-intel-mcp = "competitor_intel.adapters.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 只保留「真会出问题」的规则：语法/未定义名/导入顺序/过时写法。
# BLE001（盲捕获）、SIM117（嵌套 with）在抓取代码里是有意的，不纳入门禁。
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
# 逐步收紧：目前先保证「能跑、能发现真错误」，暂不强制全量注解。
disallow_untyped_defs = false
disallow_any_generics = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
