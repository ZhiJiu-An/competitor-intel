[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-intel"
version = "0.1.0"
description = "竞品情报系统：Schema 契约驱动的竞品采集、结构化抽取与增量 diff 报告管道"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "crawl4ai>=0.4,<0.5",
  "litellm>=1.50,<2",
  "playwright>=1.44,<2",
  "langgraph>=0.2,<0.3",
  "langgraph-checkpoint-sqlite>=2,<3",
  "langchain-core>=0.3,<0.4",
  "pydantic>=2.7,<3",
  "aiosqlite>=0.20,<0.21",
  "typer>=0.15,<0.20",
  "tenacity>=8.2,<9",
  "structlog>=24.1,<25",
  "selectolax>=0.3,<0.4",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# 只装内核（抓取 + 抽取 + 报告）时不需要任何 extra
mcp = ["mcp>=2.3,<3"]
http = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1", "markdown>=3.6,<4"]
schedule = ["celery>=5.4,<6", "redis>=5,<7"]
all = ["competitor-intel[mcp,http,schedule]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27,<1", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
ci = "competitor_intel.cli:app"
competitor-intel-mcp = "competitor_intel.adapters.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
